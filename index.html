<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#17112d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Honmoon Adventures — Desktop Test 0.2</title>
  
  <style>
:root {
  --bg: #17112d;
  --glass: rgba(20, 12, 44, .78);
  --line: rgba(255,255,255,.22);
  --text: #fff;
  --pink: #ff4ed7;
  --cyan: #66e9ff;
  --gold: #ffd76b;
}
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); font-family: system-ui, -apple-system, Segoe UI, sans-serif; touch-action:none; }
#gameCanvas { width:100%; height:100%; display:block; outline:none; }
#hud { position:fixed; inset:0; pointer-events:none; color:var(--text); }
.topbar { display:flex; gap:12px; align-items:center; justify-content:space-between; padding: max(10px, env(safe-area-inset-top)) 14px 0; }
.character-card, .objective, .icon-btn { pointer-events:auto; background:var(--glass); border:1px solid var(--line); backdrop-filter: blur(8px); box-shadow:0 8px 24px rgba(0,0,0,.25); }
.character-card { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:16px; }
.portrait { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-weight:800; background:linear-gradient(135deg, #a65cff, #ff5fd7); }
.character-name { font-size:14px; font-weight:800; letter-spacing:.04em; }
.dev-tag { font-size:9px; opacity:.65; font-weight:600; }
.hearts { color:#ff5c83; font-size:18px; letter-spacing:2px; }
.objective { padding:10px 16px; border-radius:999px; font-size:14px; text-align:center; }
.icon-btn { width:44px; height:44px; border-radius:14px; color:white; font-size:20px; }
.message { position:absolute; left:50%; top:16%; transform:translateX(-50%); background:rgba(0,0,0,.58); border:1px solid var(--line); padding:10px 18px; border-radius:999px; font-weight:800; letter-spacing:.03em; }
.hidden { display:none !important; }
.joystick { pointer-events:auto; position:absolute; left:24px; bottom:24px; width:132px; height:132px; border-radius:50%; background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.22); box-shadow: inset 0 0 24px rgba(0,0,0,.2); }
.stick { position:absolute; width:62px; height:62px; left:35px; top:35px; border-radius:50%; background:rgba(255,255,255,.32); border:2px solid rgba(255,255,255,.5); }
.actions { pointer-events:auto; position:absolute; right:22px; bottom:22px; display:grid; grid-template-columns:88px 88px; grid-template-rows:76px 92px; gap:10px; align-items:center; }
.action { color:white; border:none; border-radius:50%; font-size:28px; background:rgba(37,24,73,.82); border:1px solid var(--line); box-shadow:0 8px 20px rgba(0,0,0,.28); }
.action span { display:block; font-size:10px; margin-top:2px; }
.action.primary { grid-column:2; grid-row:1 / span 2; width:92px; height:92px; background:linear-gradient(145deg,#9f4bff,#ff4ed7); }
.action.secondary { width:76px; height:76px; }
.seal-panel { pointer-events:auto; position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(circle at center, rgba(77,32,128,.65), rgba(10,7,24,.88)); padding:20px; }
.seal-title { color:var(--gold); font-weight:900; letter-spacing:.09em; font-size:clamp(20px,4vw,38px); text-align:center; text-shadow:0 0 18px rgba(255,215,107,.4); }
.seal-subtitle { margin-top:6px; opacity:.85; }
.question { margin:22px 0; font-size:clamp(42px,9vw,82px); font-weight:900; }
.answers { width:min(620px,92vw); display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.answers button { border:1px solid rgba(255,255,255,.25); border-radius:18px; padding:18px; font-size:clamp(24px,5vw,42px); color:white; background:rgba(255,255,255,.12); }
.seal-hint { min-height:34px; margin-top:16px; font-weight:800; }
.parent-panel { pointer-events:auto; position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.55); padding:20px; }
.panel-card { width:min(520px,92vw); background:#21163f; border:1px solid var(--line); border-radius:22px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.4); }
.panel-title { font-weight:900; font-size:24px; margin-bottom:10px; }
.panel-card label { display:block; margin:20px 0; }
.panel-card button { width:100%; padding:14px; border:0; border-radius:14px; background:#fff; color:#21163f; font-weight:800; }

.enemy-hud { position:absolute; top:76px; left:50%; transform:translateX(-50%); width:min(420px,62vw); background:rgba(18,8,36,.88); border:1px solid rgba(255,255,255,.22); border-radius:16px; padding:8px 12px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
.enemy-name { text-align:center; font-size:12px; font-weight:900; letter-spacing:.08em; margin-bottom:6px; }
.enemy-bar { height:14px; background:rgba(255,255,255,.12); border-radius:999px; overflow:hidden; border:1px solid rgba(255,255,255,.18); }
.enemy-fill { height:100%; width:100%; background:linear-gradient(90deg,#ff4b7d,#a64bff); transition:width .18s ease; }
.seal-action { pointer-events:auto; position:absolute; left:50%; bottom:40px; transform:translateX(-50%); border:none; border-radius:999px; padding:16px 28px; font-size:22px; font-weight:900; color:white; background:linear-gradient(135deg,#6a4cff,#ff4ed7); box-shadow:0 0 28px rgba(255,78,215,.55),0 10px 30px rgba(0,0,0,.35); animation:pulseSeal 1s ease-in-out infinite alternate; }
@keyframes pulseSeal { from{transform:translateX(-50%) scale(1)} to{transform:translateX(-50%) scale(1.06)} }
.flash-hit { animation:hitFlash .18s linear; }
@keyframes hitFlash { 50%{filter:brightness(2.2)} }

@media (max-height: 560px) {
  .joystick { width:112px; height:112px; }
  .stick { width:54px; height:54px; left:29px; top:29px; }
  .actions { transform:scale(.9); transform-origin:bottom right; }
  .objective { font-size:12px; padding:8px 12px; }
}

</style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="topbar">
      <div class="character-card">
        <div class="portrait placeholder">R</div>
        <div>
          <div class="character-name">RUMI <span class="dev-tag">prototype</span></div>
          <div class="hearts">♥ ♥ ♥</div>
        </div>
      </div>
      <div id="objective" class="objective">MISSION : Approche-toi de la présence étrange…</div>
      <button id="parentBtn" class="icon-btn" aria-label="Espace parents">⚙</button>
    </div>

    <div id="message" class="message hidden"></div>

    <div id="enemyHud" class="enemy-hud hidden">
      <div class="enemy-name">DÉMON DE L’OMBRE</div>
      <div class="enemy-bar"><div id="enemyFill" class="enemy-fill"></div></div>
    </div>

    <button id="sealBtn" class="seal-action hidden">✨ SCELLER</button>

    <div id="joystick" class="joystick" aria-label="Joystick">
      <div id="stick" class="stick"></div>
    </div>

    <div class="actions">
      <button id="jumpBtn" class="action secondary">↥<span>Saut</span></button>
      <button id="dodgeBtn" class="action secondary">↯<span>Esquive</span></button>
      <button id="attackBtn" class="action primary">⚔<span>Attaque</span></button>
    </div>

    <div id="sealPanel" class="seal-panel hidden">
      <div class="seal-title">SCEAU DE L'HONMOON</div>
      <div class="seal-subtitle">Complète le sceau</div>
      <div id="question" class="question">8 + 7 = ?</div>
      <div id="answers" class="answers"></div>
      <div id="sealHint" class="seal-hint"></div>
    </div>

    <div id="parentPanel" class="parent-panel hidden">
      <div class="panel-card">
        <div class="panel-title">ESPACE PARENTS</div>
        <p>Prototype : les réglages détaillés arriveront après validation du gameplay.</p>
        <label><input id="learningToggle" type="checkbox" checked /> Activer le sceau éducatif</label>
        <button id="closeParent">Fermer</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:false, stencil:false, adaptToDeviceRatio:true });
  engine.setHardwareScalingLevel(Math.max(1, window.devicePixelRatio > 1.5 ? 1.35 : 1));

  let player, demon, camera, scene, sword;
  const input = { x:0, y:0, attacking:false, jump:false, dodge:false };
  let demonHP = 6;
  const DEMON_MAX_HP = 6;
  let playerHP = 3;
  let playerInvulnerable = 0;
  let demonAttackCooldown = 1.2;
  let demonStunned = false;
  const BASE_Y = 1.05;
  let verticalVelocity = 0;
  let onGround = true;
  let dodgeTime = 0;
  let dodgeDir = new BABYLON.Vector3(0,0,0);
  let attackTime = 0;
  let encounterStarted = false;
  let sealOpened = false;

  function neonMat(scene, name, color) {
    const m = new BABYLON.StandardMaterial(name, scene);
    m.diffuseColor = color.scale(.35);
    m.emissiveColor = color.scale(.7);
    m.specularColor = BABYLON.Color3.Black();
    return m;
  }

  function createScene() {
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.035,0.025,0.085,1);
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
    scene.fogDensity = .012;
    scene.fogColor = new BABYLON.Color3(.07,.05,.16);

    const light = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0,1,0), scene);
    light.intensity = .9;

    const ground = BABYLON.MeshBuilder.CreateGround('ground', { width:48, height:58 }, scene);
    const gm = new BABYLON.StandardMaterial('groundMat', scene);
    gm.diffuseColor = new BABYLON.Color3(.07,.08,.12);
    gm.specularColor = BABYLON.Color3.Black();
    ground.material = gm;

    // Stylised Seoul test street.
    const buildingColors = [
      new BABYLON.Color3(.18,.08,.35),
      new BABYLON.Color3(.08,.16,.32),
      new BABYLON.Color3(.22,.09,.18)
    ];
    for (let i=0;i<14;i++) {
      const side = i%2===0 ? -1 : 1;
      const z = -24 + (i*4);
      const h = 4 + ((i*7)%6);
      const b = BABYLON.MeshBuilder.CreateBox('building'+i,{width:7,height:h,depth:3.4},scene);
      b.position.set(side*8.5,h/2,z);
      const m = new BABYLON.StandardMaterial('bm'+i,scene);
      m.diffuseColor = buildingColors[i%buildingColors.length];
      m.specularColor = BABYLON.Color3.Black();
      b.material = m;
      const sign = BABYLON.MeshBuilder.CreatePlane('sign'+i,{width:2.6,height:.8},scene);
      sign.position.set(side*6.72,2.2,z+.4);
      sign.rotation.y = side<0 ? Math.PI/2 : -Math.PI/2;
      sign.material = neonMat(scene,'signm'+i, i%2===0 ? new BABYLON.Color3(1,.22,.75):new BABYLON.Color3(.2,.85,1));
    }

    // Honmoon portal / alley landmark.
    const torus = BABYLON.MeshBuilder.CreateTorus('portal',{diameter:3.2,thickness:.18,tessellation:48},scene);
    torus.position.set(0,1.8,19);
    torus.rotation.x = Math.PI/2;
    torus.material = neonMat(scene,'portalMat',new BABYLON.Color3(.45,.25,1));

    // Player is intentionally a placeholder capsule until final film-accurate model is sourced.
    player = BABYLON.MeshBuilder.CreateCapsule('player',{height:2.1,radius:.45},scene);
    player.position.set(0,1.05,-18);
    player.material = neonMat(scene,'playerMat',new BABYLON.Color3(.68,.26,1));

    sword = BABYLON.MeshBuilder.CreateBox('sword',{width:.12,height:1.35,depth:.08},scene);
    sword.parent = player;
    sword.position.set(.55,.15,.05);
    sword.rotation.z = -.5;
    sword.material = neonMat(scene,'swordMat',new BABYLON.Color3(.9,.8,.25));

    demon = BABYLON.MeshBuilder.CreateSphere('demon',{diameter:1.35,segments:12},scene);
    demon.position.set(0,.75,15.5);
    demon.material = neonMat(scene,'demonMat',new BABYLON.Color3(.9,.05,.3));
    const horn1 = BABYLON.MeshBuilder.CreateCylinder('horn1',{height:.65,diameterTop:0,diameterBottom:.28,tessellation:8},scene);
    const horn2 = horn1.clone('horn2');
    horn1.parent=demon; horn2.parent=demon;
    horn1.position.set(-.35,.65,0); horn2.position.set(.35,.65,0);
    horn1.rotation.z=-.3; horn2.rotation.z=.3;
    horn1.material=demon.material; horn2.material=demon.material;
    const eyeMat=neonMat(scene,'eyeMat',new BABYLON.Color3(1,.82,.12));
    [-.22,.22].forEach((x,i)=>{ const eye=BABYLON.MeshBuilder.CreateSphere('eye'+i,{diameter:.13,segments:8},scene); eye.parent=demon; eye.position.set(x,.12,-.63); eye.material=eyeMat; });

    camera = new BABYLON.ArcRotateCamera('camera', -Math.PI/2, 1.1, 7.8, player.position.add(new BABYLON.Vector3(0,1,0)), scene);
    camera.lowerRadiusLimit = 5.5; camera.upperRadiusLimit = 10;
    camera.lowerBetaLimit=.7; camera.upperBetaLimit=1.35;
    camera.attachControl(canvas,true);
    camera.inputs.attached.pointers.buttons = [0];
    camera.panningSensibility = 0;
    camera.wheelPrecision = 80;

    return scene;
  }

  function flash(text, ms=1200) {
    const el = document.getElementById('message');
    el.textContent = text; el.classList.remove('hidden');
    clearTimeout(flash.t); flash.t=setTimeout(()=>el.classList.add('hidden'),ms);
  }

  function openSeal() {
    if (sealOpened) return;
    sealOpened = true;
    document.getElementById('sealBtn').classList.add('hidden');
    const panel = document.getElementById('sealPanel');
    const answers = document.getElementById('answers');
    const qEl=document.getElementById('question');
    const sub=document.querySelector('.seal-subtitle');
    const hint=document.getElementById('sealHint');
    answers.innerHTML=''; hint.textContent='';
    const challenges=[
      {type:'math', subtitle:'Complète le sceau', q:'8 + 7 = ?', options:['13','14','15','16'], answer:'15'},
      {type:'fr', subtitle:'Complète le sort', q:'Quel mot contient le son « ou » ?', options:['CHAT','LOUP','PAIN','LIT'], answer:'LOUP'}
    ];
    const c=challenges[Math.floor(Math.random()*challenges.length)];
    sub.textContent=c.subtitle; qEl.textContent=c.q;
    qEl.style.fontSize=c.type==='fr'?'clamp(28px,5vw,46px)':'';
    c.options.forEach(value=>{
      const b=document.createElement('button'); b.textContent=value;
      b.addEventListener('click',()=>{
        if (value===c.answer) {
          hint.textContent='✨ SCEAU PARFAIT !';
          setTimeout(()=>{
            panel.classList.add('hidden');
            demon.setEnabled(false);
            updateEnemyHud();
            flash('DÉMON SCELLÉ !  ⭐ +100   💎 +2',2200);
            document.getElementById('objective').textContent='MISSION : Explore librement.';
            localStorage.setItem('honmoon-stars',String((+localStorage.getItem('honmoon-stars')||0)+100));
          },800);
        } else {
          b.disabled=true; b.style.opacity=.28;
          hint.textContent='Presque ! Essaie encore.';
        }
      });
      answers.appendChild(b);
    });
    panel.classList.remove('hidden');
  }

  function updateEnemyHud() {
    const hud=document.getElementById('enemyHud');
    const fill=document.getElementById('enemyFill');
    if (!encounterStarted || !demon || !demon.isEnabled()) { hud.classList.add('hidden'); return; }
    hud.classList.remove('hidden');
    fill.style.width = `${Math.max(0,demonHP)/DEMON_MAX_HP*100}%`;
  }

  function updateHearts() {
    document.querySelector('.hearts').textContent = Array.from({length:3},(_,i)=>i<playerHP?'♥':'♡').join(' ');
  }

  function damagePlayer() {
    if (playerInvulnerable>0 || dodgeTime>0 || playerHP<=0) return;
    playerHP--;
    playerInvulnerable=1.15;
    updateHearts();
    flash(playerHP>0?'AÏE ! Esquive l’attaque !':'Celine te protège !',900);
    player.scaling.copyFromFloats(1.18,.86,1.18);
    setTimeout(()=>player.scaling.copyFromFloats(1,1,1),150);
    if(playerHP<=0){
      playerHP=3;
      setTimeout(()=>{ updateHearts(); player.position.set(0,BASE_Y,-10); flash('Celine : « Reste concentrée ! »',1500); },600);
    }
  }

  function showSealButton() {
    demonStunned=true;
    document.getElementById('sealBtn').classList.remove('hidden');
    document.getElementById('objective').textContent='Le démon est affaibli — SCELLE-LE !';
    flash('Rumi : « Maintenant ! Scelle-le ! »',1500);
  }

  function attack() {
    if (attackTime > 0 || sealOpened) return;
    attackTime = .28;
    if (!demon || !demon.isEnabled() || demonStunned) return;
    const dist = BABYLON.Vector3.Distance(player.position, demon.position);
    if (dist < 2.8) {
      demonHP--;
      updateEnemyHud();
      demon.scaling = new BABYLON.Vector3(1.18,.78,1.18);
      setTimeout(()=>demon.scaling.copyFromFloats(1,1,1),120);
      flash(`Démon : ${Math.max(demonHP,0)} ♥`, 450);
      if (demonHP<=1 && document.getElementById('learningToggle').checked) showSealButton();
      else if (demonHP<=0) { demon.setEnabled(false); updateEnemyHud(); flash('DÉMON VAINCU !',1600); }
    } else flash('Trop loin !',500);
  }

  function jump() {
    if (!onGround) return;
    verticalVelocity = 7.2;
    onGround = false;
  }

  function dodge() {
    if (dodgeTime > 0) return;
    const forward = camera.getForwardRay().direction; forward.y=0; forward.normalize();
    const right = BABYLON.Vector3.Cross(BABYLON.Axis.Y, forward).normalize();
    let d = forward.scale(input.y).add(right.scale(input.x));
    if (d.lengthSquared() < .05) d = forward.scale(-1);
    d.normalize();
    dodgeDir.copyFrom(d);
    dodgeTime = .22;
    flash('ESQUIVE !',350);
  }

  function update() {
    const dt = Math.min(engine.getDeltaTime()/1000, .033);
    const forward = camera.getForwardRay().direction; forward.y=0; forward.normalize();
    const right = BABYLON.Vector3.Cross(BABYLON.Axis.Y, forward).normalize();
    const move = forward.scale(input.y).add(right.scale(input.x));
    if (dodgeTime > 0) {
      player.position.addInPlace(dodgeDir.scale(11.5*dt));
      player.rotation.y = Math.atan2(dodgeDir.x, dodgeDir.z);
      dodgeTime = Math.max(0, dodgeTime-dt);
    } else if (move.lengthSquared()>.01) {
      move.normalize();
      player.position.addInPlace(move.scale(5.2*dt));
      player.rotation.y = Math.atan2(move.x, move.z);
    }

    if (!onGround || verticalVelocity !== 0) {
      verticalVelocity -= 18.5*dt;
      player.position.y += verticalVelocity*dt;
      if (player.position.y <= BASE_Y) {
        player.position.y = BASE_Y;
        verticalVelocity = 0;
        onGround = true;
      }
    }

    if (attackTime > 0) {
      attackTime = Math.max(0, attackTime-dt);
      const phase = 1 - attackTime/.28;
      sword.rotation.z = -.5 + Math.sin(phase*Math.PI)*1.7;
      sword.position.x = .55 + Math.sin(phase*Math.PI)*.18;
      if (attackTime === 0) { sword.rotation.z = -.5; sword.position.x = .55; }
    }

    player.position.x = BABYLON.Scalar.Clamp(player.position.x,-5.7,5.7);
    player.position.z = BABYLON.Scalar.Clamp(player.position.z,-26,24);
    camera.target = BABYLON.Vector3.Lerp(camera.target, player.position.add(new BABYLON.Vector3(0,1,0)), .12);

    if (playerInvulnerable>0) playerInvulnerable=Math.max(0,playerInvulnerable-dt);
    const dist = BABYLON.Vector3.Distance(player.position, demon.position);
    if (!encounterStarted && dist < 11) {
      encounterStarted=true;
      document.getElementById('objective').textContent='⚠ PRÉSENCE DÉMONIAQUE — Affaiblis le démon !';
      flash('DÉMON REPÉRÉ !',1500);
      updateEnemyHud();
    }
    if (encounterStarted && demon.isEnabled() && !demonStunned && !sealOpened) {
      demon.rotation.y += .02;
      const toPlayer=player.position.subtract(demon.position); toPlayer.y=0;
      const d=toPlayer.length();
      if(d>2.15 && d<12){ toPlayer.normalize(); demon.position.addInPlace(toPlayer.scale(1.75*dt)); }
      demonAttackCooldown-=dt;
      if(d<=2.25 && demonAttackCooldown<=0){
        demonAttackCooldown=1.45;
        const dir=player.position.subtract(demon.position); dir.y=0; if(dir.lengthSquared()>0.01)dir.normalize();
        demon.position.addInPlace(dir.scale(.55));
        damagePlayer();
      }
    }
  }

  createScene();
  scene.onBeforeRenderObservable.add(update);
  engine.runRenderLoop(()=>scene.render());
  window.addEventListener('resize',()=>engine.resize());

  document.getElementById('attackBtn').addEventListener('pointerdown',attack);
  document.getElementById('jumpBtn').addEventListener('pointerdown',jump);
  document.getElementById('dodgeBtn').addEventListener('pointerdown',dodge);
  document.getElementById('sealBtn').addEventListener('pointerdown',openSeal);

  // Simple touch joystick.
  const joy=document.getElementById('joystick'), stick=document.getElementById('stick');
  let joyId=null;
  function joyMove(e){
    if(joyId!==e.pointerId) return;
    const r=joy.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
    let dx=e.clientX-cx, dy=e.clientY-cy; const max=r.width*.34; const len=Math.hypot(dx,dy)||1;
    if(len>max){dx=dx/len*max;dy=dy/len*max;}
    stick.style.transform=`translate(${dx}px,${dy}px)`;
    input.x=dx/max; input.y=-dy/max;
  }
  joy.addEventListener('pointerdown',e=>{joyId=e.pointerId; joy.setPointerCapture(e.pointerId); joyMove(e);});
  joy.addEventListener('pointermove',joyMove);
  joy.addEventListener('pointerup',e=>{if(joyId===e.pointerId){joyId=null;input.x=input.y=0;stick.style.transform='translate(0,0)';}});
  joy.addEventListener('pointercancel',e=>{if(joyId===e.pointerId){joyId=null;input.x=input.y=0;stick.style.transform='translate(0,0)';}});


  // Desktop keyboard controls for development/testing.
  const keys = new Set();
  window.addEventListener('keydown', e => {
    keys.add(e.code);
    if (e.code === 'Space') { e.preventDefault(); jump(); }
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') dodge();
    if (e.code === 'KeyF') attack();
    if (e.code === 'KeyE' && demonStunned) openSeal();
  });
  window.addEventListener('keyup', e => keys.delete(e.code));
  scene.onBeforeRenderObservable.add(() => {
    let kx = 0, ky = 0;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) kx -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) kx += 1;
    if (keys.has('KeyW') || keys.has('ArrowUp')) ky += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) ky -= 1;
    if (kx || ky) { input.x = kx; input.y = ky; }
    else if (joyId === null) { input.x = 0; input.y = 0; }
  });

  const parent=document.getElementById('parentPanel');
  document.getElementById('parentBtn').addEventListener('click',()=>parent.classList.remove('hidden'));
  document.getElementById('closeParent').addEventListener('click',()=>parent.classList.add('hidden'));

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
})();

</script>
</body>
</html>
